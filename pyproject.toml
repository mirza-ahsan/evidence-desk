[project]
name = "evidence-desk"
version = "0.1.0"
description = "Server-rendered evidence desk"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2",
    "pandas",
    "pydantic",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=evidence_desk --cov-report=term-missing"
